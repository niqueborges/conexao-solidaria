name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Global Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install Linting Tools
        run: pip install flake8 black
      - name: Check Formatting (Black)
        run: black --check --exclude "(node_modules|\.serverless|\.venv|venv)" . || echo "Format warnings found, but continuing..."
      - name: Lint Code (Flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=node_modules,.serverless,venv,.venv

  test-and-build-website:
    name: Test & Build Website
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ./website
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Pytest
        env:
          SECRET_KEY: "test-secret-key"
          GET_INSTITUTIONS: "http://test/institutions"
          GET_INSTITUTION: "http://test/institution"
          GET_INSTITUTIONS_BY_STATE: "http://test/state"
          GET_INSTITUTIONS_BY_REGION: "http://test/region"
          CHATBOT_API_URL: "http://test/chatbot"
        run: pytest --cov=. --cov-fail-under=80 --cov-report=term-missing tests/
      - name: Validate Docker Build
        run: docker build -t website-ci .

  test-and-build-serverless:
    name: Test & Build Serverless API
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ./serverless
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Pytest
        env:
          REGION_NAME: "us-east-1"
          TABLE_NAME: "test-table"
          BILLING_MODE: "PAY_PER_REQUEST"
          MODEL_ID: "test-model"
        run: PYTHONPATH=. pytest --cov=. --cov-fail-under=80 --cov-report=term-missing tests/
      - name: Install Serverless & Plugins
        run: |
          npm install -g serverless@3
          npm install
      - name: Serverless Package Validation
        env:
          SLS_SKIP_VALIDATE: 1
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_DEFAULT_REGION: us-east-1
        run: |
          sed -i 's/\${ssm:[^}]*}/dummy/g' serverless.yml
          serverless package

  test-and-build-chatbot:
    name: Test & Build Chatbot
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ./chatbot/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-mock
      - name: Run Pytest
        run: PYTHONPATH=. pytest --cov=. --cov-fail-under=80 --cov-report=term-missing tests/
      - name: Install Serverless & Plugins
        run: |
          npm install -g serverless@3
          npm install
      - name: Serverless Package Validation
        env:
          SLS_SKIP_VALIDATE: 1
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_DEFAULT_REGION: us-east-1
        run: serverless package
